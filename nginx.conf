client_body_temp_path /tmp/nginx-client;
proxy_temp_path /tmp/nginx-proxy;
fastcgi_temp_path /tmp/nginx-fastcgi;
uwsgi_temp_path /tmp/nginx-uwsgi;
scgi_temp_path /tmp/nginx-scgi;

server {
    listen 7860;
    server_name _;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    # Hugging Face serves this Space at *.hf.space and embeds it in an iframe on
    # huggingface.co (cross-origin), so X-Frame-Options: SAMEORIGIN would break
    # the embed. A scoped frame-ancestors CSP keeps the clickjacking defense
    # while allowing exactly those two origins. Only this one CSP directive is
    # set — a full CSP would break Streamlit's inline/eval'd frontend JS.
    add_header Content-Security-Policy "frame-ancestors 'self' https://huggingface.co https://*.hf.space" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    location /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ready {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /query {
        return 404;
    }

    location = /docs {
        return 404;
    }

    location = /redoc {
        return 404;
    }

    location ^~ /docs/ {
        return 404;
    }

    location = /openapi.json {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
