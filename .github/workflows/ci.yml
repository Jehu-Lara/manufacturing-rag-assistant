name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements-lock.txt', 'requirements-ci-lock.txt') }}

      - name: Cache Hugging Face model cache (bge-m3, ~2.3GB)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-m3-${{ runner.os }}

      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements-lock.txt --extra-index-url https://download.pytorch.org/whl/cpu
          pip install --require-hashes -r requirements-ci-lock.txt

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Type-check (mypy)
        run: mypy src

      - name: Verify frozen evaluation datasets
        run: |
          python -m src.features.evaluation.eval_set_integrity --verify
          python -m src.features.evaluation.regression_set_integrity --verify
          python -m src.features.evaluation.gate_holdout_integrity --verify

      - name: Build real corpus artifacts (chunks + retrieval index)
        run: |
          python -m src.features.ingestion.cli
          python -m src.features.retrieval.cli

      - name: Verify contextual refusal score bands
        run: python -m src.features.evaluation.gate_score_guard

      - name: Run tests
        run: pytest -v
